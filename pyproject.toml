[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[project]
name = "meml-griz"
version = "0.0.1"
description = "A Python package for analyzing Memphis Grizzlies data and building Grizzlies ML models."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "David Palmer", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "nba_api>=1.4.1",
    "pandas>=2.0.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"] # Adjust for your exact OS

[tool.pixi.dependencies]
python = ">=3.11"
uv = "*"
tqdm = ">=4.68.4,<5"
loguru = ">=0.7.3,<0.8"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.0.0"
pytest-mock = ">=3.12.0"

[tool.pixi.feature.test.pypi-dependencies]
meml-griz = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ipykernel = ">=6.0.0"
nbstripout = ">=0.7.0"
uv = ">=0.1.0"   

[tool.pixi.environments]
default = ["test"]
test = { features = ["test"], solve-group = "default" }
dev = { features = ["test", "dev"], solve-group = "default" }

[tool.pixi.tasks]
build = "uv build"
test = "pytest -vvvv tests/"
